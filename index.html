<!DOCTYPE html>
<html lang="ja">
<link rel="icon" type="image/png" href="icon.png">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MapleStory 動画検索ナビゲーター</title>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        /* 3つのコンテナを横並びにするラッパー */
        .main-wrapper {
            display: flex;
            gap: 20px;
            width: 100%;
            max-width: 1300px; /* お気に入りが増えたため全体の幅を拡張 */
            align-items: flex-start;
            justify-content: center;
        }

        .search-container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 500px;
            box-sizing: border-box;
        }

        /* 左右のサイドコンテナ（お気に入りと履歴）の共通スタイル */
        .side-container {
            background-color: #ffffff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 360px;
            box-sizing: border-box;
        }

        .side-container h2 {
            font-size: 16px;
            color: #2c3e50;
            margin-top: 0;
            margin-bottom: 15px;
            font-weight: 700;
            border-bottom: 2px solid #eef2f5;
            padding-bottom: 10px;
        }

        .item-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .list-item {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
        }

        .item-link {
            flex-grow: 1;
            display: block;
            padding: 8px 10px;
            background-color: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: 6px;
            color: #495057;
            text-decoration: none;
            font-size: 12px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            transition: all 0.2s ease;
        }

        .item-link:hover {
            background-color: #fff6ee;
            border-color: #ffdbb5;
            color: #ff9f43;
            transform: translateX(3px);
        }

        /* 削除ボタンのスタイル */
        .delete-btn {
            background-color: #ffeff0;
            border: 1px solid #fecdd3;
            color: #f43f5e;
            border-radius: 6px;
            padding: 6px 10px;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
        }

        .delete-btn:hover {
            background-color: #f43f5e;
            border-color: #e11d48;
            color: #ffffff;
        }

        .no-data {
            font-size: 13px;
            color: #adb5bd;
            text-align: center;
            padding: 20px 0;
        }

        h1 {
            font-size: 20px;
            color: #2c3e50;
            margin-top: 0;
            margin-bottom: 20px;
            text-align: center;
            font-weight: 700;
            border-bottom: 2px solid #eef2f5;
            padding-bottom: 15px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: bold;
            color: #7f8c8d;
            margin-bottom: 6px;
        }

        select {
            width: 100%;
            padding: 10px 12px;
            font-size: 15px;
            border: 1px solid #ccd1d9;
            border-radius: 6px;
            background-color: #fbfbfb;
            color: #434a54;
            outline: none;
            box-sizing: border-box;
        }

        select:focus {
            border-color: #ff9f43;
            background-color: #fff;
        }

        .region-select {
            background-color: #fff6ee;
            border: 1px solid #ffdbb5;
        }

        /* ボタン配置エリア */
        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .search-btn {
            flex: 2;
            padding: 14px;
            font-size: 15px;
            font-weight: bold;
            color: #fff;
            background-color: #ff9f43;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(255, 159, 67, 0.3);
            transition: background-color 0.2s, transform 0.1s;
        }

        .search-btn:hover { background-color: #ff8f23; }
        .search-btn:active { transform: scale(0.98); }

        /* お気に入り登録ボタンのスタイル */
        .bookmark-btn {
            flex: 1;
            padding: 14px;
            font-size: 13px;
            font-weight: bold;
            color: #ff9f43;
            background-color: #fff6ee;
            border: 1px solid #ffdbb5;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .bookmark-btn:hover {
            background-color: #ff9f43;
            color: #fff;
        }
        .bookmark-btn:active { transform: scale(0.98); }

        .hidden { display: none !important; }

        /* レスポンシブ対応 */
        @media (max-width: 1200px) {
            .main-wrapper {
                flex-direction: column;
                align-items: center;
            }
            .search-container, .side-container {
                max-width: 500px;
            }
        }
    </style>
</head>

    // ページロード時の初期化
    document.addEventListener("DOMContentLoaded", function() {
        renderHistory();
        renderBookmarks();
    });

    // 共通のデータ生成処理（URLとラベルのオブジェクトを作る）
    function buildSearchData() {
        const region = document.getElementById('region').value;
        const content = document.getElementById('content').value;
        const rawJob = document.getElementById('job').value;
        const rawBoss = document.getElementById('boss').value;
        const rawDiff = document.getElementById('difficulty').value;
        const rawParty = document.getElementById('partyType').value;
        const rawCt = document.getElementById('ctReduce').value;
        const rawArea = document.getElementById('area').value;
        const rawTopic = document.getElementById('otherTopic').value;

        let keywords = [];
        keywords.push(translationTable.meta[region].ゲーム名);

        if (content === '水路') {
            keywords.push(translationTable.meta[region].水路);
        } else if (content === '狩り') {
            keywords.push(translationTable.meta[region].狩り);
        }

        if (content === 'その他' && rawTopic && translationTable.other[rawTopic]) {
            keywords.push(translationTable.other[rawTopic][region]);
        }

        if (rawJob && translationTable.job[rawJob]) {
            keywords.push(translationTable.job[rawJob][region]);
        }

        if (rawCt && (content === '水路' || content === 'other')) {
            const ctUnit = (region === 'GMS') ? 's ' : (region === 'KMS') ? '초 ' : '';
            const ctVal = rawCt.replace('秒', ctUnit);
            keywords.push(ctVal + (translationTable.meta[region].CT減少 || ''));
        }

        if (rawArea && translationTable.area[rawArea] && (content === '狩り' || content === 'その他')) {
            keywords.push(translationTable.area[rawArea][region]);
        }

        if (content === 'ボス' || content === 'その他') {
            if (rawBoss && translationTable.boss[rawBoss]) {
                keywords.push(translationTable.boss[rawBoss][region]);
            }
            if (rawDiff && translationTable.difficulty[rawDiff]) {
                keywords.push(translationTable.difficulty[rawDiff][region]);
            }
            if (rawParty) {
                keywords.push(translationTable.meta[region][rawParty]);
            }
        }

        const searchQuery = keywords.join(' ');
        const url = `https://www.youtube.com/results?search_query=${encodeURIComponent(searchQuery)}`;

        let labelParts = [region, content];
        const jobText = getSelectedText('job');
        if (jobText) labelParts.push(jobText);

        if (content === 'ボス' || content === 'その他') {
            const bossText = getSelectedText('boss');
            const diffText = getSelectedText('difficulty');
            const partyText = getSelectedText('partyType');
            if (bossText) labelParts.push(bossText);
            if (diffText) labelParts.push(diffText);
            if (partyText) labelParts.push(partyText);
        }
        if (content === '狩り' || content === 'その他') {
            const areaText = getSelectedText('area');
            if (areaText) labelParts.push(areaText);
        }
        if (content === '水路' || content === 'その他') {
            const ctText = getSelectedText('ctReduce');
            if (ctText) labelParts.push(ctText);
        }
        if (content === 'その他') {
            const topicText = getSelectedText('otherTopic');
            if (topicText) labelParts.push(topicText);
        }

        return { label: labelParts.join(' / '), url: url };
    }

    function getSelectedText(id) {
        const el = document.getElementById(id);
        if (!el || el.classList.contains('hidden') || el.value === "") return "";
        return el.options[el.selectedIndex].text.split(' (')[0]; 
    }

    // 検索実行ハンドラ
    function handleSearch(event) {
        event.preventDefault();
        const data = buildSearchData();
        saveHistory(data.label, data.url);
        window.open(data.url, '_blank');
    }

    /* ---------------- 履歴機能 ---------------- */
    function renderHistory() {
        const historyList = document.getElementById('historyList');
        const historyData = localStorage.getItem('searchHistory');
        const history = historyData ? JSON.parse(historyData) : [];

        if (history.length === 0) {
            historyList.innerHTML = '<li class="no-data">履歴はまだありません</li>';
            return;
        }

        historyList.innerHTML = history.map((item, index) => `
            <li class="list-item">
                <a href="${item.url}" target="_blank" class="item-link" title="${item.label}">
                    ${item.label}
                </a>
                <button class="delete-btn" onclick="deleteHistory(${index})">削除</button>
            </li>
        `).join('');
    }

    function saveHistory(label, url) {
        const historyData = localStorage.getItem('searchHistory');
        let history = historyData ? JSON.parse(historyData) : [];
        history.unshift({ label: label, url: url });
        if (history.length > 10) history.pop();
        localStorage.setItem('searchHistory', JSON.stringify(history));
        renderHistory();
    }

    function deleteHistory(index) {
        const historyData = localStorage.getItem('searchHistory');
        if (!historyData) return;
        let history = JSON.parse(historyData);
        history.splice(index, 1);
        localStorage.setItem('searchHistory', JSON.stringify(history));
        renderHistory();
    }

    /* ---------------- お気に入り(ブックマーク)機能 ---------------- */
    function renderBookmarks() {
        const bookmarkList = document.getElementById('bookmarkList');
        const bookmarkData = localStorage.getItem('searchBookmarks');
        const bookmarks = bookmarkData ? JSON.parse(bookmarkData) : [];

        if (bookmarks.length === 0) {
            bookmarkList.innerHTML = '<li class="no-data">お気に入りはまだありません</li>';
            return;
        }

        bookmarkList.innerHTML = bookmarks.map((item, index) => `
            <li class="list-item">
                <a href="${item.url}" target="_blank" class="item-link" title="${item.label}">
                    ⭐ ${item.label}
                </a>
                <button class="delete-btn" onclick="deleteBookmark(${index})">削除</button>
            </li>
        `).join('');
    }

    function addBookmark() {
        const data = buildSearchData();
        const bookmarkData = localStorage.getItem('searchBookmarks');
        let bookmarks = bookmarkData ? JSON.parse(bookmarkData) : [];
        
        // 重複チェック
        const isDuplicate = bookmarks.some(item => item.label === data.label && item.url === data.url);
        if (isDuplicate) {
            alert('この設定は既にお気に入りに登録されています。');
            return;
        }

        bookmarks.unshift(data); // 先頭に追加
        localStorage.setItem('searchBookmarks', JSON.stringify(bookmarks));
        renderBookmarks();
    }

    function deleteBookmark(index) {
        const bookmarkData = localStorage.getItem('searchBookmarks');
        if (!bookmarkData) return;
        let bookmarks = JSON.parse(bookmarkData);
        bookmarks.splice(index, 1);
        localStorage.setItem('searchBookmarks', JSON.stringify(bookmarks));
        renderBookmarks();
    }
</script>
